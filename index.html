<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trening</title>
  <meta name="description" content="Plan, kalendarz i postęp z trenera kolarskiego.">
  <meta name="theme-color" content="#0e1317" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef1f3" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brand" type="button" aria-label="Przejdź do widoku Dziś">Trening</button>
    <div class="topbar-right">
      <span class="sync" id="sync" aria-live="polite"></span>
      <button class="icon-btn" id="refresh" type="button" aria-label="Odśwież dane">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="settings" type="button" aria-label="Ustawienia">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Widoki">
    <button type="button" data-view="dzis" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h3v-5H3zM8 18h3V8H8zM13 18h3v-8h-3zM18 18h3V4h-3z" fill="currentColor"/></svg>
      <span>Dziś</span>
    </button>
    <button type="button" data-view="kalendarz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Kalendarz</span>
    </button>
    <button type="button" data-view="postep">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18M4 15l5-5 4 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Postęp</span>
    </button>
  </nav>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-inner" id="sheet-inner"></div>
  </div>
  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js" defer></script>
</body>
</html>
